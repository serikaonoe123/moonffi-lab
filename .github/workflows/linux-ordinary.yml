name: Linux ordinary native validation

on:
  push:
    branches: [codex/linux-ordinary-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ordinary:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install content-locked Linux toolchain
        run: |
          python3 scripts/test_linux_toolchain.py
          python3 scripts/linux_toolchain.py --destination "$RUNNER_TEMP/moonffi-linux" --out results/linux-bootstrap
      - name: Validate committed ordinary native functionality
        run: |
          python3 scripts/verify-linux.py --toolchain "$RUNNER_TEMP/moonffi-linux" --out results/linux-ordinary
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ordinary-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            results/linux-bootstrap/*.json
            results/linux-bootstrap/*.log
            results/linux-ordinary/**/*.json
            results/linux-ordinary/**/*.jsonl
            results/linux-ordinary/**/*.log
            !results/linux-ordinary/**/workspace/**
