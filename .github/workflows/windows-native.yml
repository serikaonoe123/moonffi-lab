name: Windows native validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [behavior, asan, benchmark, generation, sdk, sqlite]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Source preparation compares the candidate with its recorded ancestor.
          fetch-depth: ${{ matrix.suite == 'sdk' && '0' || '1' }}
      - name: Install content-locked MoonBit in a fresh directory
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchainRoot = Join-Path $env:RUNNER_TEMP 'moonffi-locked-toolchain'
          & ./scripts/install-toolchain.ps1 -Destination $toolchainRoot -Out results/bootstrap
          "MOON_HOME=$toolchainRoot" | Add-Content $env:GITHUB_ENV
          (Join-Path $toolchainRoot 'bin') | Add-Content $env:GITHUB_PATH
      - name: Verify toolchain rejection boundaries
        if: matrix.suite == 'behavior'
        run: |
          & ./scripts/verify-toolchain.ps1 -ArchiveDirectory results/bootstrap/downloads -ToolchainRoot $env:MOON_HOME -Out results/toolchain-checks
      - name: Validate an exported commit with fresh dependencies
        env:
          LAB_SUITE: ${{ matrix.suite }}
        run: |
          & ./scripts/verify-clean.ps1 -Suite $env:LAB_SUITE -Out results/ci
      - name: Verify local source candidate preparation
        if: matrix.suite == 'sdk'
        run: |
          # The released rc.1 stays frozen. New development must be rejected by
          # its old release gate until a new candidate has its own evidence.
          & ./scripts/verify-release-preparation.ps1 -Ref 23893d5bb3a231a21df10db506d8da821a7e984d -RejectRuntimeRef HEAD -Out results/release-checks
      - name: Verify source rejection and caller environment restoration
        if: matrix.suite == 'sqlite'
        run: |
          & ./scripts/verify-script-controls.ps1 -UpstreamArchive results/ci/sqlite/upstream-source.zip -OfflineDependencySource results/ci/workspace/.mooncakes -Out results/script-controls
      - name: Retain diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-${{ matrix.suite }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            results/bootstrap/*.json
            results/bootstrap/*.log
            results/toolchain-checks/*.json
            results/toolchain-checks/*-output/*.json
            results/script-controls/**/*.json
            results/script-controls/**/*.log
            results/release-checks/verification.json
            results/release-checks/failure.json
            results/release-checks/*.log
            results/release-checks/a/candidate.json
            results/release-checks/a/source-manifest.json
            results/ci/**/*.json
            results/ci/**/*.jsonl
            results/ci/**/*.log
            results/ci/**/*.md
            !results/ci/**/workspace/**
