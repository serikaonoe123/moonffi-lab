name: Linux native error acceptance

on:
  push:
    branches: [codex/native-errors-local-review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install content-locked toolchain
        run: |
          python3 scripts/test_linux_toolchain.py
          python3 scripts/linux_toolchain.py --destination "$RUNNER_TEMP/moonffi-linux" --out results/linux-bootstrap
      - name: Ordinary native regression on this commit
        run: python3 scripts/verify-linux.py --toolchain "$RUNNER_TEMP/moonffi-linux" --out results/linux-ordinary
      - name: Owned crash and ASan reduction acceptance
        run: |
          python3 scripts/verify-linux-native-errors.py --toolchain "$RUNNER_TEMP/moonffi-linux" --out results/linux-native-errors --dependency-source results/linux-ordinary/workspace/.mooncakes/moonbitlang/async
      - name: Retain raw diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-errors-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            results/linux-bootstrap/*.json
            results/linux-bootstrap/*.log
            results/linux-ordinary/**/*.json
            results/linux-ordinary/**/*.jsonl
            results/linux-ordinary/**/*.log
            results/linux-native-errors/**/*.json
            results/linux-native-errors/**/*.jsonl
            results/linux-native-errors/**/*.log
            !results/**/workspace/**
            !results/**/exported/**
