{
  "name": "Reproduction feedback / 复现反馈",
  "description": "Report a first run, a successful reproduction, or the first step that failed.",
  "title": "[Reproduction] ",
  "body": [
    {"type":"markdown","attributes":{"value":"Start with the [reproduction guide](https://github.com/serikaonoe123/moonffi-lab/blob/main/docs/INDEPENDENT-REPRODUCTION.md). Failed and incomplete first runs are useful. 失败和未完成的首次运行也有价值；未执行的项目请如实填写。"}},
    {"type":"input","id":"source_commit","attributes":{"label":"Exact source commit / 实际完整提交 SHA","description":"Record git rev-parse HEAD for the source you actually ran."},"validations":{"required":true}},
    {"type":"dropdown","id":"participation","attributes":{"label":"Participation / 是否参与该提交开发或验证","options":["I did not develop or previously validate this commit / 未参与","I developed or previously validated this commit / 曾参与","Unsure / 不确定"]},"validations":{"required":true}},
    {"type":"textarea","id":"environment","attributes":{"label":"Environment and sources / 环境与来源","description":"Include OS/architecture, Windows PowerShell/MSVC/SDK or Linux distribution/Python/GCC/G++, actual tool versions, and toolchain/async sources; unknown is acceptable.","placeholder":"OS / architecture:\nWindows: PowerShell / MSVC / SDK, or Linux: distribution / Python / GCC / G++:\nmoon / moonc / moonrun:\nToolchain source and content-lock result:\nasync source (download / cache / not restored):"},"validations":{"required":true}},
    {"type":"textarea","id":"command","attributes":{"label":"Command and first obstacle / 命令与第一个卡点","description":"Include the actual working directory and command. If it passed, say so; if access was denied, retain the message and stop that action.","render":"text"},"validations":{"required":true}},
    {"type":"textarea","id":"results","attributes":{"label":"Results actually observed / 实际观察到的结果","description":"Use pass, fail, incomplete or not run for each item; include the failure stage and relevant evidence paths.","placeholder":"Top-level verification:\nWindows: behavior / asan / benchmark / generation / sdk / sqlite / native-errors:\nLinux: ordinary / native-errors:\nWindows nine script controls:\nHistorical rc.1 source preparation controls (optional):\nverification.json / failure.json / raw logs:"},"validations":{"required":true}},
    {"type":"textarea","id":"followup","attributes":{"label":"Retries and suggestions / 重试与建议","description":"Include changed settings or new output directories. Preserve the original failure."},"validations":{"required":false}}
  ]
}
